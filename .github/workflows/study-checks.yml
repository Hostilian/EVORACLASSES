name: Public study checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the public study package
        # Official actions/checkout v4 commit verified from actions/checkout on 9 October 2026.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check public files, links, history and study capacity
        run: python3 scripts/validate-public-study.py
